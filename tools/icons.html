<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#15151c;display:flex;flex-wrap:wrap;gap:16px;padding:16px;font-family:Inter}
  .icon{width:256px;height:256px;display:flex;align-items:center;justify-content:center}
  .icon svg{width:256px;height:256px}
  svg *{stroke:#fff;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  svg .f{fill:#fff;stroke:none}
  svg .fs{fill:#fff}
</style></head><body>

<div class="icon" id="sun"><svg viewBox="0 0 100 100">
  <circle class="f" cx="50" cy="50" r="19"/>
  <g><line x1="50" y1="8" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="92"/>
  <line x1="8" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="92" y2="50"/>
  <line x1="20.3" y1="20.3" x2="27.4" y2="27.4"/><line x1="72.6" y1="72.6" x2="79.7" y2="79.7"/>
  <line x1="20.3" y1="79.7" x2="27.4" y2="72.6"/><line x1="72.6" y1="27.4" x2="79.7" y2="20.3"/></g>
</svg></div>

<div class="icon" id="moon"><svg viewBox="0 0 100 100">
  <path class="f" d="M58 10 A40 40 0 1 0 90 62 A31 31 0 0 1 58 10 Z"/>
  <path class="f" d="M74 18 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
</svg></div>

<div class="icon" id="swap"><svg viewBox="0 0 100 100">
  <path d="M18 34 H78"/><path d="M64 20 L80 34 L64 48"/>
  <path d="M82 66 H22"/><path d="M36 52 L20 66 L36 80"/>
</svg></div>

<div class="icon" id="hint"><svg viewBox="0 0 100 100">
  <path d="M36 66 C36 56 26 50 26 37 A24 24 0 0 1 74 37 C74 50 64 56 64 66 Z" class="fs"/>
  <line x1="38" y1="78" x2="62" y2="78"/><line x1="42" y1="90" x2="58" y2="90"/>
</svg></div>

<div class="icon" id="check"><svg viewBox="0 0 100 100" style="stroke-width:12">
  <path d="M18 52 L40 74 L84 28" style="stroke-width:12"/>
</svg></div>

<div class="icon" id="close"><svg viewBox="0 0 100 100">
  <path d="M24 24 L76 76 M76 24 L24 76" style="stroke-width:12"/>
</svg></div>

<div class="icon" id="backspace"><svg viewBox="0 0 100 100">
  <path d="M34 22 H86 V78 H34 L12 50 Z"/>
  <path d="M48 38 L70 62 M70 38 L48 62"/>
</svg></div>

<div class="icon" id="keypad"><svg viewBox="0 0 100 100">
  <rect class="f" x="14" y="14" width="18" height="18" rx="5"/><rect class="f" x="41" y="14" width="18" height="18" rx="5"/><rect class="f" x="68" y="14" width="18" height="18" rx="5"/>
  <rect class="f" x="14" y="41" width="18" height="18" rx="5"/><rect class="f" x="41" y="41" width="18" height="18" rx="5"/><rect class="f" x="68" y="41" width="18" height="18" rx="5"/>
  <rect class="f" x="14" y="68" width="18" height="18" rx="5"/><rect class="f" x="41" y="68" width="18" height="18" rx="5"/><rect class="f" x="68" y="68" width="18" height="18" rx="5"/>
</svg></div>

<div class="icon" id="partner"><svg viewBox="0 0 100 100">
  <circle class="f" cx="34" cy="32" r="13"/>
  <path class="f" d="M10 84 C10 62 20 52 34 52 C48 52 58 62 58 84 Z"/>
  <circle cx="68" cy="32" r="12" style="stroke-width:6;stroke-dasharray:6 5"/>
  <path d="M60 54 C76 52 90 62 90 84 H66" style="stroke-width:6;stroke-dasharray:6 5"/>
</svg></div>

<div class="icon" id="exit"><svg viewBox="0 0 100 100">
  <path d="M56 14 H84 V86 H56"/>
  <path d="M14 50 H62"/><path d="M46 34 L62 50 L46 66"/>
</svg></div>

<div class="icon" id="info"><svg viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40"/>
  <line x1="50" y1="46" x2="50" y2="72" style="stroke-width:10"/>
  <circle class="f" cx="50" cy="30" r="6"/>
</svg></div>

<div class="icon" id="warning"><svg viewBox="0 0 100 100">
  <path d="M50 12 L90 84 H10 Z"/>
  <line x1="50" y1="38" x2="50" y2="60" style="stroke-width:10"/>
  <circle class="f" cx="50" cy="72" r="5.5"/>
</svg></div>

<div class="icon" id="sparkle"><svg viewBox="0 0 100 100">
  <path class="f" d="M44 8 C47 34 54 41 80 44 C54 47 47 54 44 80 C41 54 34 47 8 44 C34 41 41 34 44 8 Z"/>
  <path class="f" d="M78 64 C79 74 82 77 92 78 C82 79 79 82 78 92 C77 82 74 79 64 78 C74 77 77 74 78 64 Z"/>
</svg></div>

<div class="icon" id="lock"><svg viewBox="0 0 100 100">
  <path d="M32 44 V32 A18 18 0 0 1 68 32 V44"/>
  <rect class="f" x="20" y="44" width="60" height="44" rx="9"/>
</svg></div>

<div class="icon" id="lever"><svg viewBox="0 0 100 100">
  <rect class="f" x="18" y="72" width="64" height="16" rx="6"/>
  <path d="M50 72 L68 24" style="stroke-width:9"/>
  <circle class="f" cx="70" cy="20" r="11"/>
</svg></div>

<div class="icon" id="shard"><svg viewBox="0 0 100 100">
  <path class="fs" d="M50 8 L82 40 L50 92 L18 40 Z"/>
  <path d="M18 40 H82 M50 8 L38 40 L50 92 L62 40 Z" style="stroke:#15151c;stroke-width:4"/>
</svg></div>

<div class="icon" id="egg"><svg viewBox="0 0 100 100">
  <path class="fs" d="M50 8 C72 8 84 42 84 60 A34 34 0 0 1 16 60 C16 42 28 8 50 8 Z"/>
  <path d="M20 56 L34 46 L46 58 L58 46 L70 58 L82 50" style="stroke:#15151c;stroke-width:5"/>
</svg></div>

<div class="icon" id="skip"><svg viewBox="0 0 100 100">
  <path class="f" d="M12 20 L46 50 L12 80 Z"/><path class="f" d="M42 20 L76 50 L42 80 Z"/>
  <line x1="86" y1="20" x2="86" y2="80" style="stroke-width:10"/>
</svg></div>

<div class="icon" id="eye"><svg viewBox="0 0 100 100">
  <path d="M6 50 C20 26 36 18 50 18 C64 18 80 26 94 50 C80 74 64 82 50 82 C36 82 20 74 6 50 Z"/>
  <circle class="f" cx="50" cy="50" r="15"/>
</svg></div>

</body></html>
